<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:20px 0;border:2px solid {{ brand.text_color }};border-radius:12px;">
<tr><td style="padding:16px 20px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.7;color:{{ brand.text_color }};">
<strong>Reference:</strong> {{ booking.reference }}<br>
<strong>Package:</strong> {{ booking.package_name }}<br>
<strong>Date:</strong> {{ booking.event_date | long_date }}<br>
<strong>Start time:</strong> {{ booking.event_start_time | clock }}<br>
<strong>Venue:</strong> {{ booking.venue_address }}<br>
<strong>Guests:</strong> {{ booking.guest_count }}
</td></tr>
</table>
